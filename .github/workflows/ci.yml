name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  consistency-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/reference/requirements.txt
      - run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pip install -r tools/reference/requirements.txt

      - name: Generate synthetic fixtures (inverse-mapping renderer)
        run: python3 tools/reference/render_inverse.py

      - name: Verify render accuracy
        run: |
          python3 tools/reference/verify_render.py fixtures/synthetic-01
          python3 tools/reference/verify_render.py fixtures/synthetic-poor-01

      - name: Generate reference calibrations
        run: |
          python3 tools/reference/calibrate_reference.py fixtures/synthetic-01
          python3 tools/reference/calibrate_reference.py fixtures/synthetic-poor-01

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Consistency tests (good dataset)
        run: pnpm test:consistency

      - name: Consistency tests (poor dataset)
        run: FIXTURE_DIR=fixtures/synthetic-poor-01 npx vitest run --config vitest.consistency.config.ts tests/consistency.spec.ts

      - name: Worker responsiveness test
        run: pnpm test:worker

      - name: Build for offline test
        run: pnpm build

      - name: Offline test
        run: pnpm test:offline
