name: Installers

# Builds the compressed download for each platform and starts the installed app once.
# Unsigned: signing and notarization need the owner's certificates.
# A tag "v<version>", for example v0.1.0-beta.1, builds the same downloads and puts them into a draft release for the owner to look
# over and publish. Nothing is published by the tag alone. When the release was made by hand first, the
# downloads are added to it.
on:
  pull_request:
    paths: ["packaging/**", ".github/workflows/package.yml", "pyproject.toml", "src/**"]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 xz-utils
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Version
        id: v
        shell: bash
        # The version as it goes into file names and the tag: 0.1.0b1 in the code reads 0.1.0-beta.1 here.
        run: echo "file=$(python -c 'import plumbline; print(plumbline.VERSION_FILE)')" >> "$GITHUB_OUTPUT"
      - name: The tag must name the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.file }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v${{ steps.v.outputs.file }}, the version in src/plumbline/__init__.py"; exit 1
          fi
      - name: Build the app
        run: pyinstaller packaging/plumbline.spec --noconfirm

      # ---------------------------------------------------------------- Windows
      - name: Windows installer (Inno Setup, LZMA2 solid)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.v.outputs.file }}" packaging\windows.iss
          Get-ChildItem dist\installer
      - name: Install it and start the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $target = "$env:RUNNER_TEMP\PlumblineInstalled"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait
          $env:PLUMBLINE_SMOKE = "1"
          $env:PLUMBLINE_SMOKE_FILE = "$env:RUNNER_TEMP\smoke.txt"
          Start-Process -FilePath "$target\Plumbline.exe" -Wait
          Get-Content "$env:RUNNER_TEMP\smoke.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke.txt" -Pattern "SMOKE_OK")) { exit 1 }

      # ------------------------------------------------------------------ macOS
      - name: macOS disk image (LZMA)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/installer dist/dmg
          cp -R dist/Plumbline.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # hdiutil now and then answers "Resource busy" on hosted runners; a second try goes through.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Plumbline" -srcfolder dist/dmg -ov -format ULMO \
              "dist/installer/Plumbline-${{ steps.v.outputs.file }}-${{ matrix.name }}.dmg"; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done
      - name: Open the disk image and start the app from it
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/installer/*.dmg -nobrowse -mountpoint /tmp/plumbline-dmg
          PLUMBLINE_SMOKE=1 /tmp/plumbline-dmg/Plumbline.app/Contents/MacOS/Plumbline | tee smoke.txt
          sleep 2
          hdiutil detach /tmp/plumbline-dmg || hdiutil detach /tmp/plumbline-dmg -force
          grep -q SMOKE_OK smoke.txt

      # ------------------------------------------------------------------ Linux
      - name: Linux AppImage (zstd) and tar.xz
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/installer AppDir/usr/lib
          cp -a dist/Plumbline AppDir/usr/lib/Plumbline
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/plumbline.desktop AppDir/plumbline.desktop
          cp src/plumbline/assets/app-icon.png AppDir/plumbline.png
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # The AppImage tool in use only packs with zstd; the tar.xz below is the smaller download.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --comp zstd \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 22 \
            AppDir "dist/installer/Plumbline-${{ steps.v.outputs.file }}-${{ matrix.name }}.AppImage"
          tar -C dist -cf - Plumbline | xz -6 -T0 > "dist/installer/Plumbline-${{ steps.v.outputs.file }}-${{ matrix.name }}.tar.xz"
      - name: Start the AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/installer/*.AppImage
          PLUMBLINE_SMOKE=1 dist/installer/*.AppImage --appimage-extract-and-run | tee smoke.txt
          grep -q SMOKE_OK smoke.txt

      - name: Sizes
        shell: bash
        run: |
          echo "## ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_OS" = "macOS" ]; then SRC=dist/Plumbline.app; else SRC=dist/Plumbline; fi
          echo "UNPACKED_MB $(du -sm "$SRC" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in dist/installer/*; do
            echo "DOWNLOAD_MB $(python -c "import os,sys; print(round(os.path.getsize(sys.argv[1])/1048576,1))" "$f") $(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Plumbline-${{ steps.v.outputs.file }}-${{ matrix.name }}
          path: dist/installer/*
          retention-days: 14
          compression-level: 0

  release:
    # Only for a version tag, and only when all four downloads were built and started.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd downloads && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python tools/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on the website (which is what creates the tag there) gets the files added;
          # a tag pushed on its own gets a draft release to look over and publish.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" downloads/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" downloads/* --draft --prerelease \
              --title "Plumbline ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

