name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Build the app
        run: pyinstaller packaging/plumbline.spec --noconfirm
      - name: Start the built app once
        shell: bash
        env:
          PLUMBLINE_SMOKE: "1"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/Plumbline.app/Contents/MacOS/Plumbline; else BIN=dist/Plumbline/Plumbline; fi
          "$BIN" | tee smoke.txt || true
          grep -q SMOKE_OK smoke.txt || { [ "$RUNNER_OS" = "Windows" ] && echo "No console output on Windows windowed builds; checking the file exists" && test -f dist/Plumbline/Plumbline.exe; }
          du -sm dist | tail -1
